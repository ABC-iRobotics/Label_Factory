name: label-factory
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - pyyaml
  - matplotlib
  - pillow
  - pip:
      - -r ui/requirements.txt
      - opencv-contrib-python
      # Open3D 0.20 defaults to a Vulkan renderer on Linux and aborts in the
      # Docker/X11 viewer when no compatible Vulkan instance is exposed.
      # The GUI was developed and tested with the OpenGL-based 0.19 wheel.
      - open3d==0.19.0
      - imageio
      - imageio-ffmpeg
      - plyfile
      - trimesh
      - pyrealsense2
      - pycolmap-cuda12==4.0.4
